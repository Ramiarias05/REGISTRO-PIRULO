<div class="app">
<header class="top"><div class="brand"><div class="brand-line"><img src="valma-logo-negro.png?v=6.3" alt="VALMA GROUP"><div><div class="eyebrow">VALMA GROUP · PRODUCCIONES</div><h1>Registro Pirulo</h1><p>Todo lo de la gira, en un solo lugar.</p></div></div></div><div class="userbar"><button class="logout" id="adminBtn" style="display:none" onclick="current='admin';render()">⚙️ Administración</button><button class="logout" onclick="logout()">Cerrar sesión</button><button class="add" onclick="openModal()">＋ Agregar</button></div></header>

<div class="field"><label>Nombre</label><input id="name" required placeholder="Nombre"></div><div class="field"><label>Ciudad</label><input id="city" placeholder="Ciudad"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="phone" placeholder="+54 9..."></div><div class="field"><label>Dirección</label><input id="address" placeholder="Dirección"></div><div class="field" id="genericContactField"><label>Contacto / cargo</label><input id="contact" placeholder="Ej. Juan — Producción"></div><div class="field"><label>Calificación</label><select id="rating"><option value="">Sin calificar</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div><div class="field"><label>Favorito</label><select id="favorite"><option value="no">No</option><option value="si">Sí</option></select></div>

</div><div class="modal-actions"><button type="button" class="cancel" onclick="askBeforeClose('modal',closeModal)">Cancelar</button><button type="submit" class="save" id="recordSave">Guardar registro</button></div></form></div></div>

<div class="field"><label>Fecha</label><input id="hdate" type="date" required></div>
<div class="field"><label>Ciudad</label><input id="hcity" placeholder="Ej. Villa María" required></div>
<div class="field full"><label>Lugares de la visita <small>(podés seleccionar varios)</small></label><select id="hplace" multiple size="6"></select><small class="help">Mantené ⌘ (Mac) o Ctrl (Windows) para seleccionar varios lugares.</small></div>
<div class="field"><label>Actividad</label><input id="hactivity" placeholder="Función, visita, hotel, reunión..." ></div>
<div class="field full"><label>Notas</label><textarea id="hnotes" placeholder="Qué hicieron, con quién, observaciones, etc."></textarea></div>
</div><div class="modal-actions"><button type="button" class="cancel" onclick="askBeforeClose('historyModal',closeHistoryModal)">Cancelar</button><button type="button" class="save" id="historySave">Guardar visita</button></div></form></div></div><div class="modal detail-modal" id="detailModal"><div class="sheet"><div class="detail-brand"><img src="valma-logo-negro.png?v=6.3" alt="VALMA GROUP"></div><h2 id="detailTitle">Detalle</h2><div id="detailBody"></div><div class="modal-actions"><button type="button" class="cancel" onclick="closeDetailModal()">Cerrar</button><button type="button" id="detailEdit" class="save">✏️ Editar</button><button type="button" id="detailDelete" class="save danger-fill">🗑️ Eliminar</button></div></div></div><div class="modal" id="adminModal"><div class="sheet"><h2>Administración</h2><div id="adminModalBody"></div><div class="modal-actions"><button type="button" class="cancel" onclick="closeAdminModal()">Cerrar</button></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zokglvgjjbbmeqyfjcro.supabase.co"; const SUPABASE_KEY="sb_publishable_WJ95387z4Kh4in6X94QsQg_shJ1TWfV"; const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
const seed=[
{id:1,type:'hotel',name:'Hotel de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Reemplazar con datos reales.'},
{id:2,type:'teatro',name:'Teatro de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Ficha preparada para completar.'},
{id:3,type:'restaurante',name:'Restaurante de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Lugar para el equipo.'},
{id:4,type:'contacto',name:'Productor local',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Contacto principal de la plaza.'}
];
let data=[];let historyData=[];let current='inicio';let currentProfile=null;let isAdmin=false;let editingHistoryId=null;let historyFilterCity='';let historyFilterPlaceId='';
async function loadProfile(){
  if(!currentUser){currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';return;}
  const {data:p,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  currentProfile=p||null;
  isAdmin=!!p&&p.role==='admin'&&p.active!==false;
  const btn=document.getElementById('adminBtn'); if(btn) btn.style.display=isAdmin?'inline-block':'none';
}
async function logActivity(action,entityType='',entityId=null,detail=''){
  if(!currentUser)return;
  const {error}=await supabaseClient.from('activity_log').insert({user_id:currentUser.id,action,entity_type:entityType,entity_id:entityId,detail});
  if(error) console.warn('No se pudo registrar actividad',error);
}
async function markLogin(){
  if(!currentUser)return;
  await supabaseClient.from('profiles').update({last_login_at:new Date().toISOString()}).eq('id',currentUser.id);
  await logActivity('Inicio de sesión');
}
async function loadData(){
  if(!currentUser){data=[];return;}
  let {data:rows,error}=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
  if(error){console.error(error);toast('No se pudieron cargar los registros');data=[];return;}
  rows=rows||[];
  // Migra automáticamente los registros locales de la versión anterior, si existen y la nube está vacía.
  if(rows.length===0){
    try{
      const raw=localStorage.getItem('registroPirulo');
      const local=raw?JSON.parse(raw):[];
      if(Array.isArray(local)&&local.length){
        const payload=local.map(x=>({user_id:currentUser.id,type:x.type,name:x.name,city:x.city||'',phone:x.phone||'',address:x.address||'',contact:x.contact||'',rating:x.rating||'',favorite:!!x.favorite,notes:x.notes||''}));
        const {error:me}=await supabaseClient.from('registros').insert(payload);
        if(!me){
          const again=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
          rows=again.data||[];
          localStorage.removeItem('registroPirulo');
          toast('Registros anteriores migrados ✓');
        }
      }
    }catch(e){console.warn('No se pudo migrar el almacenamiento local',e)}
  }
  data=rows;
  const hr=await supabaseClient.from('historial_giras').select('*').order('visit_date',{ascending:false});
  if(hr.error){console.error(hr.error);historyData=[]}else historyData=hr.data||[];
}

const labels={hotel:'🏨 Hoteles',teatro:'🎭 Teatros',restaurante:'🍽️ Restaurantes',cochera:'🚗 Cocheras',contacto:'👤 Contactos',ciudad:'📍 Ciudades'};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){let items=[['inicio','Inicio'],['hotel','🏨 Hoteles'],['teatro','🎭 Teatros'],['restaurante','🍽️ Restaurantes'],['cochera','🚗 Cocheras'],['contacto','👤 Contactos'],['ciudad','📍 Ciudades'],['historial','📅 Historial']];if(isAdmin)items.push(['admin','⚙️ Administración']);document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${current===k?'active':''}" onclick="current='${k}';if('${k}'!=='historial'){historyFilterCity='';historyFilterPlaceId=''}render()">${v}</button>`).join('')}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function searchable(x){return Object.values(x||{}).map(v=>typeof v==='object'?JSON.stringify(v):String(v??'')).join(' ')}
function card(x){let meta=[x.city,x.address].filter(Boolean).join(' · ');return `<article class="card clickable" onclick="openDetail(${x.id})"><span class="tag">${labels[x.type]}${x.favorite?' · ⭐':''}</span><h4>${esc(x.name)}</h4>${meta?`<div class="meta">📍 ${esc(meta)}</div>`:''}${x.contact?`<div class="meta">👤 ${esc(x.contact)}</div>`:''}${x.phone?`<div class="meta">📞 ${esc(x.phone)}</div>`:''}${x.rating?`<div class="meta">${x.rating}</div>`:''}<div class="actions" onclick="event.stopPropagation()">${x.phone?`<button onclick="location.href='tel:${esc(x.phone)}'">Llamar</button><button onclick="window.open('https://wa.me/${x.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}${x.address?`<button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.address+' '+x.city)}','_blank')">Mapa</button>`:''}<button onclick="historyFilterPlaceId='${x.id}';historyFilterCity='${esc(x.city||'').replace(/'/g,'\'')}';current='historial';render()">Historial</button></div></article>`}

const detailLabels={price:'💰 Precio',currency:'💵 Moneda',room:'🛏️ Tipo de habitación',breakfast:'🍳 Desayuno incluido',dining:'🍽️ Comedor',parking:'🚗 Estacionamiento',parking_cars:'🚗 Cochera para autos',parking_vans:'🚐 Cochera para camionetas',wifi:'📶 WiFi',checkin:'🕐 Check-in',checkout:'🕐 Check-out',payment:'💳 Formas de pago',conditions:'📋 Condiciones',capacity:'👥 Capacidad',screen:'🖥️ ¿Tiene pantalla?',showtime:'🎟️ Horario de función',arrival:'🕐 Horario de llegada',sound:'🎧 Sonido',lighting:'💡 Iluminación',stage:'🎬 Escenario',service:'🍽️ Servicio',menu:'🍽️ Menú',drinks:'🥤 Bebidas incluidas',people:'👥 Cantidad de personas',opening:'🕐 Horario',accepts_cars:'🚗 Acepta autos',accepts_vans:'🚐 Acepta camionetas',max_height:'📏 Altura máxima',phone_alt:'📞 Teléfono / WhatsApp',position:'💼 Cargo',company:'🏢 Empresa / lugar',email:'✉️ Email',notes:'📝 Información',province:'🗺️ Provincia',country:'🌎 País',citynotes:'📝 Información de la ciudad'};

  let result;
  if(editingId){
    result=await supabaseClient.from('registros').update(payload).eq('id',editingId);
  }else{
    result=await supabaseClient.from('registros').insert({...payload,user_id:currentUser.id});
  }
  const {error}=result;
  if(error){console.error(error);btn.disabled=false;toast((editingId?'No se pudieron guardar los cambios: ':'No se pudo guardar: ')+(error.message||'error'));return false}
  await logActivity(editingId?'Registro modificado':'Registro creado', 'registro', editingId||null, payload.name||'');
await loadData();closeModal();render();toast(editingId?'Cambios guardados ✓':'Registro guardado ✓');setTimeout(()=>{btn.disabled=false},250);return false
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();addRecord()});async function removeItem(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const {error}=await supabaseClient.from('registros').delete().eq('id',id);
  if(error){console.error(error);toast('No se pudo eliminar');return}
  await logActivity('Registro eliminado','registro',id);
  await loadData();render();toast('Registro eliminado')
}
async function logout(){await logActivity('Cierre de sesión');await supabaseClient.auth.signOut()}
function showAuth(message=''){
  document.getElementById('authScreen').classList.add('show');
  document.getElementById('authError').style.display=message?'block':'none';
  document.getElementById('authError').textContent=message;
  document.querySelector('.app').style.display='none';
}
function hideAuth(){
  document.getElementById('authScreen').classList.remove('show');
  document.querySelector('.app').style.display='block';
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Ingresando...';
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) showAuth('Correo o contraseña incorrectos.');
  btn.disabled=false;btn.textContent='Iniciar sesión';
});
supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    hideAuth();
    await loadProfile();
    if(_event==='SIGNED_IN') await markLogin();
    await loadData();render();
  }else{data=[];currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';showAuth();}
});
showAuth();

</script></body></html>
