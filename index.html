<script>
const SUPABASE_URL="https://zokglvgjjbbmeqyfjcro.supabase.co"; const SUPABASE_KEY="sb_publishable_WJ95387z4Kh4in6X94QsQg_shJ1TWfV"; const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
const seed=[

let data=[];let historyData=[];let current='inicio';let currentProfile=null;let isAdmin=false;let editingHistoryId=null;let historyFilterCity='';let historyFilterPlaceId='';
async function loadProfile(){
  if(!currentUser){currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';return;}
  const {data:p,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  currentProfile=p||null;
  isAdmin=!!p&&p.role==='admin'&&p.active!==false;
  const btn=document.getElementById('adminBtn'); if(btn) btn.style.display=isAdmin?'inline-block':'none';
}
async function logActivity(action,entityType='',entityId=null,detail=''){
  if(!currentUser)return;
  const {error}=await supabaseClient.from('activity_log').insert({user_id:currentUser.id,action,entity_type:entityType,entity_id:entityId,detail});
  if(error) console.warn('No se pudo registrar actividad',error);
}
async function markLogin(){
  if(!currentUser)return;
  await supabaseClient.from('profiles').update({last_login_at:new Date().toISOString()}).eq('id',currentUser.id);
  await logActivity('Inicio de sesión');
}
async function loadData(){
  if(!currentUser){data=[];return;}
  let {data:rows,error}=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
  if(error){console.error(error);toast('No se pudieron cargar los registros');data=[];return;}
  rows=rows||[];
  // Migra automáticamente los registros locales de la versión anterior, si existen y la nube está vacía.
  if(rows.length===0){
    try{
      const raw=localStorage.getItem('registroPirulo');
      const local=raw?JSON.parse(raw):[];
      if(Array.isArray(local)&&local.length){
        const payload=local.map(x=>({user_id:currentUser.id,type:x.type,name:x.name,city:x.city||'',phone:x.phone||'',address:x.address||'',contact:x.contact||'',rating:x.rating||'',favorite:!!x.favorite,notes:x.notes||''}));
        const {error:me}=await supabaseClient.from('registros').insert(payload);
        if(!me){
          const again=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
          rows=again.data||[];
          localStorage.removeItem('registroPirulo');
          toast('Registros anteriores migrados ✓');
        }
      }
    }catch(e){console.warn('No se pudo migrar el almacenamiento local',e)}
  }
  data=rows;
  const hr=await supabaseClient.from('historial_giras').select('*').order('visit_date',{ascending:false});
  if(hr.error){console.error(hr.error);historyData=[]}else historyData=hr.data||[];
}

const labels={hotel:'🏨 Hoteles',teatro:'🎭 Teatros',restaurante:'🍽️ Restaurantes',contacto:'👤 Contactos',ciudad:'📍 Ciudades'};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){let items=[['inicio','Inicio'],['hotel','🏨 Hoteles'],['teatro','🎭 Teatros'],['restaurante','🍽️ Restaurantes'],['contacto','👤 Contactos'],['ciudad','📍 Ciudades'],['historial','📅 Historial']];if(isAdmin)items.push(['admin','⚙️ Administración']);document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${current===k?'active':''}" onclick="current='${k}';if('${k}'!=='historial'){historyFilterCity='';historyFilterPlaceId=''}render()">${v}</button>`).join('')}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function searchable(x){return Object.values(x||{}).map(v=>typeof v==='object'?JSON.stringify(v):String(v??'')).join(' ')}
function card(x){let meta=[x.city,x.address].filter(Boolean).join(' · ');return `<article class="card clickable" onclick="openDetail(${x.id})"><span class="tag">${labels[x.type]}${x.favorite?' · ⭐':''}</span><h4>${esc(x.name)}</h4>${meta?`<div class="meta">📍 ${esc(meta)}</div>`:''}${x.contact?`<div class="meta">👤 ${esc(x.contact)}</div>`:''}${x.phone?`<div class="meta">📞 ${esc(x.phone)}</div>`:''}${x.rating?`<div class="meta">${x.rating}</div>`:''}<div class="actions" onclick="event.stopPropagation()">${x.phone?`<button onclick="location.href='tel:${esc(x.phone)}'">Llamar</button><button onclick="window.open('https://wa.me/${x.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}${x.address?`<button onclick="window.open('https://maps.apple.com/?q=${encodeURIComponent(x.address+' '+x.city)}','_blank')">Mapa</button>`:''}<button onclick="historyFilterPlaceId='${x.id}';historyFilterCity='${esc(x.city||'').replace(/'/g,'\'')}';current='historial';render()">Historial</button></div></article>`}
function cityCard(x){let n=data.filter(y=>norm(y.city)===norm(x.city)).length;return `<article class="card city" onclick="historyFilterCity='${esc(x.city).replace(/'/g,'\'')}';historyFilterPlaceId='';current='historial';render()" style="cursor:pointer"><div class="cityicon">📍</div><div><h4>${esc(x.city)}</h4><small>${n} registro${n===1?'':'s'} asociados · ver historial →</small></div></article>`}
function detailValue(v){if(v===undefined||v===null||v==='')return '';const map={si:'Sí',no:'No',algunas:'Algunas',fijo:'Menú fijo',eleccion:'A elección',buffet:'Buffet',simple:'Simple',doble:'Doble',triple:'Triple',multiple:'Múltiple',propio:'Propio',teatro:'Del teatro',mixto:'Mixto',propia:'Propia',mixta:'Mixta'};return map[String(v)]||String(v)}
function openDetail(id){const x=data.find(r=>Number(r.id)===Number(id));if(!x)return;const d=x.details||{};let html=`<div class="detail-grid">${[['Tipo',labels[x.type]],['Ciudad',x.city],['Dirección',x.address],['Teléfono / WhatsApp',x.phone],['Contacto',x.contact],['Calificación',x.rating],['Favorito',x.favorite?'Sí':'No']].filter(([,v])=>v).map(([k,v])=>`<div class="detail-item"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}${Object.entries(d).filter(([,v])=>v!==''&&v!==null&&v!==undefined).map(([k,v])=>`<div class="detail-item"><b>${esc(k.replace(/_/g,' '))}</b><span>${esc(detailValue(v))}</span></div>`).join('')}</div>${x.notes?`<div class="notes" style="margin-top:14px"><b>📝 Notas</b><br>${esc(x.notes)}</div>`:''}`;document.getElementById('detailTitle').textContent=x.name;document.getElementById('detailBody').innerHTML=html;document.getElementById('detailEdit').onclick=()=>{closeDetailModal();editItem(x.id)};document.getElementById('detailDelete').onclick=async()=>{closeDetailModal();await removeItem(x.id)};document.getElementById('detailModal').classList.add('open')}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('open')}
function renderHistory(filtered){let rows=historyData.slice();if(historyFilterCity)rows=rows.filter(h=>norm(h.city)===norm(historyFilterCity));if(historyFilterPlaceId)rows=rows.filter(h=>{const ids=Array.isArray(h.place_ids)?h.place_ids:(h.place_id?[h.place_id]:[]);return ids.map(String).includes(String(historyFilterPlaceId))});const q=norm(document.getElementById('search').value||'');if(q)rows=rows.filter(h=>norm(searchable(h)).includes(q));const groups={};rows.forEach(h=>{const y=(h.visit_date||'').slice(0,4)||'Sin año';(groups[y]??=[]).push(h)});const cards=Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(y=>`<div class="history-year">${esc(y)}</div><div class="cards">${groups[y].map(h=>`<article class="history-item clickable" onclick="openHistoryDetail(${h.id})"><h4>📅 ${esc(h.visit_date||'')}</h4><div class="history-tags"><button class="history-tag" onclick="event.stopPropagation();openHistoryDetail(${h.id})">📍 ${esc(h.city||'')}</button></div>${h.activity?`<div class="meta">🎬 ${esc(h.activity)}</div>`:''}</article>`).join('')}</div>`).join('');document.getElementById('content').innerHTML=`<div class="section-head"><div><h3>📅 Historial / Giras</h3>${historyFilterCity?`<div class="meta">Ciudad: <b>${esc(historyFilterCity)}</b> · <button class="link" onclick="historyFilterCity='';historyFilterPlaceId='';render()">Ver todo</button></div>`:''}</div><button class="primary" onclick="openHistoryModal()">＋ Registrar visita</button></div>${cards||'<div class="empty">Todavía no hay visitas registradas.<br><br>Agregá la primera fecha de una gira.</div>'}`}
function openHistoryDetail(id){const h=historyData.find(x=>Number(x.id)===Number(id));if(!h)return;const ids=Array.isArray(h.place_ids)?h.place_ids:(h.place_id?[h.place_id]:[]);const places=ids.map(id=>data.find(x=>String(x.id)===String(id))).filter(Boolean);const typeLabels={hotel:'🏨 Hotel',theater:'🎭 Teatro',restaurant:'🍽️ Comedor / Restaurante',contact:'👤 Contacto',city:'📍 Ciudad'};const groups={};places.forEach(p=>{const key=p.type||'other';(groups[key]??=[]).push(p.name)});const placeBlocks=Object.entries(groups).map(([type,names])=>`<div class="detail-item"><b>${esc(typeLabels[type]||'🏷️ Lugar')}</b><span>${names.map(esc).join('<br>')}</span></div>`).join('');document.getElementById('detailTitle').textContent=`Visita — ${h.city||''}`;document.getElementById('detailBody').innerHTML=`<div class="detail-grid"><div class="detail-item"><b>📅 Fecha</b><span>${esc(h.visit_date||'')}</span></div><div class="detail-item"><b>📍 Localidad</b><span>${esc(h.city||'')}</span></div>${placeBlocks||'<div class="detail-item"><b>🏷️ Lugares</b><span>Sin lugares asociados</span></div>'}${h.activity?`<div class="detail-item"><b>🎬 Actividad</b><span>${esc(h.activity)}</span></div>`:''}</div>${h.notes?`<div class="notes" style="margin-top:14px"><b>📝 Notas</b><br>${esc(h.notes)}</div>`:''}`;document.getElementById('detailEdit').onclick=()=>{closeDetailModal();editHistory(h.id)};document.getElementById('detailDelete').onclick=async()=>{closeDetailModal();await removeHistory(h.id)};document.getElementById('detailModal').classList.add('open')}

function editHistory(id){const h=historyData.find(x=>Number(x.id)===Number(id));if(!h)return;editingHistoryId=h.id;document.getElementById('historyModalTitle').textContent='Editar visita / gira';document.getElementById('hdate').value=h.visit_date||'';document.getElementById('hcity').value=h.city||'';document.getElementById('hactivity').value=h.activity||'';document.getElementById('hnotes').value=h.notes||'';const ids=h.place_ids||(h.place_id?[h.place_id]:[]);populateHistoryPlaces(ids).then(()=>document.getElementById('historyModal').classList.add('open'))}
async function saveHistory(){const btn=document.getElementById('historySave');if(btn.disabled)return;const city=document.getElementById('hcity').value.trim();if(!city||!document.getElementById('hdate').value){toast('Completá fecha y ciudad');return}btn.disabled=true;const place_ids=[...document.getElementById('hplace').selectedOptions].map(o=>Number(o.value));const payload={visit_date:document.getElementById('hdate').value,city,place_ids,place_id:place_ids[0]||null,activity:document.getElementById('hactivity').value.trim(),notes:document.getElementById('hnotes').value.trim()};const result=editingHistoryId?await supabaseClient.from('historial_giras').update(payload).eq('id',editingHistoryId):await supabaseClient.from('historial_giras').insert({...payload,user_id:currentUser.id});if(result.error){toast('No se pudo guardar: '+result.error.message);btn.disabled=false;return}await logActivity(editingHistoryId?'Visita modificada':'Visita registrada','historial_giras',editingHistoryId||null,city);await loadData();closeHistoryModal();render();toast(editingHistoryId?'Cambios guardados ✓':'Visita registrada ✓');btn.disabled=false}
async function removeHistory(id){if(!confirm('¿Eliminar esta visita del historial?'))return;const {error}=await supabaseClient.from('historial_giras').delete().eq('id',id);if(error){toast('No se pudo eliminar');return}await logActivity('Visita eliminada','historial_giras',id);await loadData();render();toast('Visita eliminada')}
document.getElementById('historySave').addEventListener('click',saveHistory);
function render(){nav();let q=norm(document.getElementById('search').value||'');let filtered=data.filter(x=>norm(searchable(x)).includes(q));let c=document.getElementById('content');if(current==='admin'&&isAdmin){renderAdmin();return}if(current==='inicio'){let cities=[...new Set(data.map(x=>x.city).filter(Boolean))];c.innerHTML=`<section class="hero"><div class="eyebrow">REGISTRO PIRULO</div><h2>La información de cada plaza, siempre a mano.</h2><p>Guardá hoteles, teatros, restaurantes, contactos y ciudades para que cada gira empiece con todo organizado.</p><span class="mini">☁️ Los datos se guardan de forma segura y compartida</span></section><div class="grid"><div class="stat"><b>${data.length}</b><span>Registros</span></div><div class="stat"><b>${data.filter(x=>x.type==='hotel').length}</b><span>Hoteles</span></div><div class="stat"><b>${data.filter(x=>x.type==='teatro').length}</b><span>Teatros</span></div><div class="stat"><b>${cities.length}</b><span>Ciudades</span></div></div><div class="section-head"><h3>Últimos registros</h3><button class="link" onclick="current='inicio';document.getElementById('search').focus()">Buscar</button></div><div class="cards">${filtered.slice(-6).reverse().map(card).join('')||'<div class="empty">No encontramos registros.</div>'}</div>`}else if(current==='historial'){renderHistory(filtered)}else if(current==='ciudad'){let cities=[...new Map(filtered.filter(x=>x.city).map(x=>[norm(x.city),x])).values()];c.innerHTML=`<div class="section-head"><h3>Ciudades</h3><button class="primary" onclick="openModal('ciudad')">＋ Agregar</button></div><div class="cards">${cities.map(cityCard).join('')||'<div class="empty">Todavía no hay ciudades cargadas.</div>'}</div>`}else{c.innerHTML=`<div class="section-head"><h3>${labels[current]}</h3><button class="primary" onclick="openModal('${current}')">＋ Agregar</button></div><div class="cards">${filtered.filter(x=>x.type===current).map(card).join('')||'<div class="empty">No hay registros en esta sección.<br><br>Tocá “＋ Agregar” para cargar el primero.</div>'}</div>`}}
let editingId=null;
function renderTypeFields(existing={}){
  const type=document.getElementById('type').value;
  const d=existing||{};
  const wrap=document.getElementById('typeFields');
  const input=(id,label,ph='',type='text')=>`<div class="field"><label>${label}</label><input id="d_${id}" type="${type}" placeholder="${ph}" value="${esc(d[id]??'')}"></div>`;
  const select=(id,label,opts)=>`<div class="field"><label>${label}</label><select id="d_${id}"><option value="">Seleccionar...</option>${opts.map(o=>`<option value="${esc(o.v)}" ${String(d[id]??'')===o.v?'selected':''}>${o.t}</option>`).join('')}</select></div>`;
  const area=(id,label,ph='')=>`<div class="field full"><label>${label}</label><textarea id="d_${id}" placeholder="${ph}">${esc(d[id]??'')}</textarea></div>`;
  let html='';
  if(type==='hotel') html=[input('price','💰 Precio','Ej. $120.000'),select('currency','Moneda',[{v:'ARS',t:'Pesos argentinos (ARS)'},{v:'USD',t:'Dólares (USD)'},{v:'EUR',t:'Euros (EUR)'}]),select('room','🛏️ Tipo de habitación',[{v:'simple',t:'Simple'},{v:'doble',t:'Doble'},{v:'triple',t:'Triple'},{v:'multiple',t:'Múltiple'},{v:'otro',t:'Otro'}]),select('breakfast','🍳 Desayuno incluido',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),select('dining','🍽️ Comedor',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),select('parking','🚗 Estacionamiento',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),select('wifi','📶 WiFi',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),input('checkin','🕐 Check-in','14:00','time'),input('checkout','🕐 Check-out','10:00','time'),input('payment','💳 Formas de pago','Efectivo, transferencia, tarjeta'),area('conditions','📋 Condiciones','Políticas, reservas, señas, cancelaciones...')].join('');
  else if(type==='teatro') html=[input('capacity','👥 Capacidad','Ej. 850','number'),input('showtime','🎟️ Horario de función','20:30','time'),input('arrival','🕐 Horario de llegada','17:00','time'),select('sound','🎧 Sonido',[{v:'propio',t:'Propio'},{v:'teatro',t:'Del teatro'},{v:'mixto',t:'Mixto'}]),select('lighting','💡 Iluminación',[{v:'propia',t:'Propia'},{v:'teatro',t:'Del teatro'},{v:'mixta',t:'Mixta'}]),select('stage','🎬 Escenario',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),select('parking','🚗 Estacionamiento',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),input('price','💰 Precio / alquiler','Ej. $500.000'),input('payment','💳 Formas de pago',''),area('conditions','📋 Condiciones','Condiciones de alquiler, venta de entradas, horarios...')].join('');
  else if(type==='restaurante') html=[input('price','💰 Precio por persona','Ej. $25.000'),select('menu','🍽️ Menú',[{v:'fijo',t:'Menú fijo'},{v:'eleccion',t:'A elección'},{v:'buffet',t:'Buffet'},{v:'otro',t:'Otro'}]),select('drinks','🥤 Bebidas incluidas',[{v:'si',t:'Sí'},{v:'no',t:'No'},{v:'algunas',t:'Algunas'}]),input('people','👥 Cantidad de personas','Ej. 15','number'),input('opening','🕐 Horario','12:00 - 15:00'),select('parking','🅿️ Estacionamiento',[{v:'si',t:'Sí'},{v:'no',t:'No'}]),input('payment','💳 Formas de pago',''),area('conditions','📋 Condiciones','Reservas, menú, horarios, grupos...')].join('');
  else if(type==='contacto') html=[input('position','💼 Cargo','Ej. Gerente / Producción'),input('company','🏢 Empresa / lugar',''),input('email','✉️ Email','correo@ejemplo.com','email'),input('phone_alt','📞 Teléfono alternativo',''),area('notes','📝 Información del contacto','Datos importantes...')].join('');
  else if(type==='ciudad') html=[input('province','🗺️ Provincia','Córdoba'),input('country','🌎 País','Argentina'),area('citynotes','📝 Información','Accesos, referencias, datos de la plaza...')].join('');
  wrap.innerHTML=html;
}
function collectTypeFields(){
  const out={}; document.querySelectorAll('#typeFields [id^="d_"]').forEach(el=>{out[el.id.slice(2)]=el.value}); return out;
}
function openModal(type){
  editingId=null;
  document.getElementById('modalTitle').textContent='Nuevo registro';
  document.querySelector('.save').textContent='Guardar registro';
  document.getElementById('modal').classList.add('open');
  document.getElementById('form').reset();
  if(type&&type!=='inicio')document.getElementById('type').value=type;
  renderTypeFields();
}
function editItem(id){
  const x=data.find(r=>Number(r.id)===Number(id));
  if(!x)return;
  editingId=x.id;
  document.getElementById('modalTitle').textContent='Editar registro';
  document.querySelector('.save').textContent='Guardar cambios';
  document.getElementById('type').value=x.type||'hotel';
  document.getElementById('name').value=x.name||'';
  document.getElementById('city').value=x.city||'';
  document.getElementById('phone').value=x.phone||'';
  document.getElementById('address').value=x.address||'';
  document.getElementById('contact').value=x.contact||'';
  document.getElementById('rating').value=x.rating||'';
  document.getElementById('favorite').value=x.favorite?'si':'no';
  document.getElementById('notes').value=x.notes||'';
  renderTypeFields(x.details||{});
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('form').reset();
  editingId=null;
  document.getElementById('modalTitle').textContent='Nuevo registro';
  document.querySelector('.save').textContent='Guardar registro';
  renderTypeFields();
}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function addRecord(){
  const btn=document.querySelector('.save');
  if(btn.disabled) return false;
  const name=document.getElementById('name').value.trim();
  if(!name){document.getElementById('name').focus();toast('Completá el nombre');return false}
  btn.disabled=true;
  const payload={
    type:document.getElementById('type').value,
    name,
    city:document.getElementById('city').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    address:document.getElementById('address').value.trim(),
    contact:document.getElementById('contact').value.trim(),
    rating:document.getElementById('rating').value,
    favorite:document.getElementById('favorite').value==='si',
    notes:document.getElementById('notes').value.trim(),
    details:collectTypeFields()
  };
  let result;
  if(editingId){
    result=await supabaseClient.from('registros').update(payload).eq('id',editingId);
  }else{
    result=await supabaseClient.from('registros').insert({...payload,user_id:currentUser.id});
  }
  const {error}=result;
  if(error){console.error(error);btn.disabled=false;toast((editingId?'No se pudieron guardar los cambios: ':'No se pudo guardar: ')+(error.message||'error'));return false}
  await logActivity(editingId?'Registro modificado':'Registro creado', 'registro', editingId||null, payload.name||'');
await loadData();closeModal();render();toast(editingId?'Cambios guardados ✓':'Registro guardado ✓');setTimeout(()=>{btn.disabled=false},250);return false
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();addRecord()});document.querySelector('.save').addEventListener('click',e=>{e.preventDefault();addRecord()});async function removeItem(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const {error}=await supabaseClient.from('registros').delete().eq('id',id);
  if(error){console.error(error);toast('No se pudo eliminar');return}
  await logActivity('Registro eliminado','registro',id);
  await loadData();render();toast('Registro eliminado')
}
async function logout(){await logActivity('Cierre de sesión');await supabaseClient.auth.signOut()}
function showAuth(message=''){
  document.getElementById('authScreen').classList.add('show');
  document.getElementById('authError').style.display=message?'block':'none';
  document.getElementById('authError').textContent=message;
  document.querySelector('.app').style.display='none';
}
function hideAuth(){
  document.getElementById('authScreen').classList.remove('show');
  document.querySelector('.app').style.display='block';
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Ingresando...';
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) showAuth('Correo o contraseña incorrectos.');
  btn.disabled=false;btn.textContent='Iniciar sesión';
});
supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    hideAuth();
    await loadProfile();
    if(_event==='SIGNED_IN') await markLogin();
    await loadData();render();
  }else{data=[];currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';showAuth();}
});
showAuth();

</script></body></html>
