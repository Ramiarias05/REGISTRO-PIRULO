<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Pirulo Gira</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef0f3;--ok:#16803c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.top{padding:28px 22px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.brand small{color:var(--muted);font-weight:600;letter-spacing:.08em}.brand h1{margin:4px 0;font-size:32px}.brand p{margin:0;color:var(--muted)}.add{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:700}.search{padding:0 22px 20px}.search input{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none}.nav{display:flex;gap:8px;overflow:auto;padding:0 22px 18px}.nav button{white-space:nowrap;border:0;background:var(--soft);padding:10px 14px;border-radius:12px;color:#374151;font-weight:650}.nav button.active{background:var(--ink);color:#fff}.content{padding:0 22px 40px}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:24px;padding:22px;margin-bottom:20px}.hero .eyebrow{opacity:.7;font-size:13px;font-weight:700}.hero h2{font-size:25px;margin:6px 0}.hero p{opacity:.8;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.stat b{font-size:28px;display:block}.stat span{color:var(--muted);font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h3{margin:0;font-size:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;margin-bottom:10px}.card h4{margin:0 0 5px;font-size:18px}.card p{margin:4px 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}.empty{padding:38px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px}.sheet h2{margin:0 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#4b5563}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{border:0;border-radius:11px;padding:11px 15px;font-weight:750}.cancel{background:var(--soft)}.save{background:var(--ink);color:#fff}.tour{display:flex;gap:14px;align-items:center}.date{background:var(--soft);border-radius:13px;padding:9px 11px;text-align:center;min-width:62px}.date b{display:block;font-size:19px}.date small{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{padding-top:20px}.brand h1{font-size:27px}.grid,.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.content,.search,.nav{padding-left:16px;padding-right:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><small>VALMA GROUP · PRODUCCIONES</small><h1>Pirulo Gira</h1><p>Centro de operaciones de gira</p></div><button class="add" onclick="openModal()">＋ Agregar</button></header><div class="search"><input id="search" placeholder="Buscar hotel, teatro, ciudad, contacto..." oninput="render()"></div><nav class="nav" id="nav"></nav><main class="content" id="content"></main></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>Agregar registro</h2><form id="form"><div class="formgrid"><div class="field"><label>Tipo</label><select id="type"><option value="hotel">🏨 Hotel</option><option value="teatro">🎭 Teatro</option><option value="restaurante">🍽️ Restaurante</option><option value="contacto">👤 Contacto</option><option value="ciudad">📍 Ciudad</option></select></div><div class="field"><label>Nombre</label><input id="name" required placeholder="Nombre del lugar o persona"></div><div class="field"><label>Ciudad</label><input id="city" placeholder="Ciudad"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="phone" placeholder="+54..."></div><div class="field"><label>Dirección</label><input id="address" placeholder="Dirección"></div><div class="field"><label>Contacto / cargo</label><input id="contact" placeholder="Nombre y función"></div><div class="field full"><label>Notas</label><textarea id="notes" placeholder="Precios, condiciones, experiencia, datos importantes..."></textarea></div></div><div class="modal-actions"><button type="button" class="cancel" onclick="closeModal()">Cancelar</button><button class="save">Guardar registro</button></div></form></div></div><script>
const seed=[
{id:1,type:'hotel',name:'Hotel de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',notes:'Reemplazar con datos reales.'},
{id:2,type:'teatro',name:'Teatro de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'Producción',notes:'Ficha preparada para completar.'},
{id:3,type:'restaurante',name:'Restaurante de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',notes:'Lugar recomendado para el equipo.'},
{id:4,type:'contacto',name:'Productor local',city:'Río Cuarto',phone:'',address:'',contact:'Producción',notes:'Contacto principal de la plaza.'}
];
let data=JSON.parse(localStorage.getItem('piruloGira')||'null')||seed;let current='inicio';
const labels={hotel:'🏨 Hoteles',teatro:'🎭 Teatros',restaurante:'🍽️ Restaurantes',contacto:'👤 Contactos',ciudad:'📍 Ciudades'};
function save(){localStorage.setItem('piruloGira',JSON.stringify(data))}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){let items=[['inicio','Inicio'],['hotel','🏨 Hoteles'],['teatro','🎭 Teatros'],['restaurante','🍽️ Restaurantes'],['contacto','👤 Contactos'],['ciudad','📍 Ciudades']];document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${current===k?'active':''}" onclick="current='${k}';render()">${v}</button>`).join('')}
function card(x){let meta=[x.city,x.address].filter(Boolean).join(' · ');return `<article class="card"><span class="tag">${labels[x.type]}</span><h4>${esc(x.name)}</h4>${meta?`<p>📍 ${esc(meta)}</p>`:''}${x.contact?`<p>👤 ${esc(x.contact)}</p>`:''}${x.phone?`<p>📞 ${esc(x.phone)}</p>`:''}${x.notes?`<p>📝 ${esc(x.notes)}</p>`:''}<div class="actions">${x.phone?`<button onclick="location.href='tel:${esc(x.phone)}'">Llamar</button>`:''}${x.phone?`<button onclick="window.open('https://wa.me/${x.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}${x.address?`<button onclick="window.open('https://maps.apple.com/?q=${encodeURIComponent(x.address+' '+x.city)}','_blank')">Mapa</button>`:''}<button onclick="removeItem(${x.id})">Eliminar</button></div></article>`}
function render(){nav();let q=document.getElementById('search').value.toLowerCase().trim();let filtered=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));let c=document.getElementById('content');if(current==='inicio'){let counts=['hotel','teatro','restaurante','contacto'].map(t=>data.filter(x=>x.type===t).length);c.innerHTML=`<section class="hero"><div class="eyebrow">PRÓXIMA GIRA</div><h2>Tu base de datos, todo en un solo lugar.</h2><p>Hoteles, teatros, restaurantes, contactos y ciudades para no volver a buscar la información desde cero.</p></section><div class="grid"><div class="stat"><b>${data.length}</b><span>Registros</span></div><div class="stat"><b>${counts[0]}</b><span>Hoteles</span></div><div class="stat"><b>${counts[1]}</b><span>Teatros</span></div><div class="stat"><b>${new Set(data.map(x=>x.city).filter(Boolean)).size}</b><span>Ciudades</span></div></div><div class="section-head"><h3>Últimos registros</h3></div><div class="cards">${filtered.slice(-6).reverse().map(card).join('')||'<div class="empty">Todavía no hay registros.</div>'}</div>`}else{let title=current==='ciudad'?'Ciudades':labels[current];c.innerHTML=`<div class="section-head"><h3>${title}</h3><button class="add" onclick="openModal('${current}')">＋ Agregar</button></div><div class="cards">${filtered.filter(x=>x.type===current).map(card).join('')||'<div class="empty">No hay registros en esta sección. Tocá “＋ Agregar” para cargar el primero.</div>'}</div>`}}
function openModal(type='hotel'){document.getElementById('modal').classList.add('open');if(type!=='inicio'&&type!=='hotel')document.getElementById('type').value=type}function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset()}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();data.push({id:Date.now(),type:type.value,name:name.value.trim(),city:city.value.trim(),phone:phone.value.trim(),address:address.value.trim(),contact:contact.value.trim(),notes:notes.value.trim()});save();closeModal();render()});function removeItem(id){if(confirm('¿Eliminar este registro?')){data=data.filter(x=>x.id!==id);save();render()}}render();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
