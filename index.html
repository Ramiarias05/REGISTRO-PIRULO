<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Registro Pirulo">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><title>Registro Pirulo</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#141519;--muted:#777b84;--line:#e4e5e9;--soft:#f0f1f4;--accent:#111318;--green:#16834d;--shadow:0 10px 30px #0000000b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:40px}.top{padding:24px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.brand h1{font-size:31px;line-height:1.05;margin:4px 0}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}.add,.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 15px;font-weight:750;box-shadow:0 7px 18px #00000018}.search{padding:0 20px 14px}.searchbox{position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px 14px 42px;outline:none;box-shadow:var(--shadow)}.searchbox span{position:absolute;left:15px;top:12px;font-size:19px;color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:0 20px 17px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:0;background:var(--soft);color:#4e525b;padding:10px 13px;border-radius:12px;font-weight:700}.nav button.active{background:var(--accent);color:#fff}.content{padding:0 20px}.hero{background:linear-gradient(135deg,#101217,#30333b);color:#fff;border-radius:24px;padding:22px;margin-bottom:15px;box-shadow:0 15px 35px #00000018}.hero h2{font-size:25px;margin:7px 0 6px}.hero p{margin:0;color:#d7d8dc;line-height:1.45}.hero .mini{margin-top:17px;display:inline-flex;background:#ffffff12;border:1px solid #ffffff1c;padding:7px 10px;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 11px}.section-head h3{font-size:18px;margin:0}.link{border:0;background:transparent;color:var(--muted);font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.tag{display:inline-flex;background:var(--soft);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:10px}.card h4{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin:5px 0}.notes{color:#454850;font-size:13px;line-height:1.4;margin-top:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:750}.actions .danger{color:#b42318}.empty{grid-column:1/-1;padding:42px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.city{display:flex;align-items:center;gap:12px}.cityicon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}.city h4{margin:0 0 3px}.city small{color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:93vh;overflow:auto;border-radius:25px 25px 0 0;padding:21px;padding-bottom:calc(21px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#5d6169}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}.field textarea{min-height:92px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{border:0;border-radius:11px;padding:11px 15px;font-weight:750}.cancel{background:var(--soft)}.save{background:var(--accent);color:#fff}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#17181c;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{padding:20px 16px 13px}.brand h1{font-size:27px}.top .add{padding:10px 12px}.search,.nav,.content{padding-left:16px;padding-right:16px}.grid,.cards,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:19px}.hero h2{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="eyebrow">VALMA GROUP · PRODUCCIONES</div><h1>Registro Pirulo</h1><p>Todo lo de la gira, en un solo lugar.</p></div><button class="add" onclick="openModal()">＋ Agregar</button></header>
<div class="search"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Buscar hotel, teatro, ciudad, contacto..." oninput="render()"></div></div>
<nav class="nav" id="nav"></nav><main class="content" id="content"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>Nuevo registro</h2><form id="form"><div class="formgrid">
<div class="field"><label>Tipo</label><select id="type"><option value="hotel">🏨 Hotel</option><option value="teatro">🎭 Teatro / sala</option><option value="restaurante">🍽️ Restaurante</option><option value="contacto">👤 Contacto</option><option value="ciudad">📍 Ciudad</option></select></div>
<div class="field"><label>Nombre</label><input id="name" required placeholder="Nombre"></div><div class="field"><label>Ciudad</label><input id="city" placeholder="Ciudad"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="phone" placeholder="+54 9..."></div><div class="field"><label>Dirección</label><input id="address" placeholder="Dirección"></div><div class="field"><label>Contacto / cargo</label><input id="contact" placeholder="Ej. Juan — Producción"></div><div class="field"><label>Calificación</label><select id="rating"><option value="">Sin calificar</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div><div class="field"><label>Favorito</label><select id="favorite"><option value="no">No</option><option value="si">Sí</option></select></div><div class="field full"><label>Notas</label><textarea id="notes" placeholder="Precios, condiciones, experiencia, horarios, datos importantes..."></textarea></div>
</div><div class="modal-actions"><button type="button" class="cancel" onclick="closeModal()">Cancelar</button><button type="button" class="save">Guardar registro</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,type:'hotel',name:'Hotel de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Reemplazar con datos reales.'},
{id:2,type:'teatro',name:'Teatro de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Ficha preparada para completar.'},
{id:3,type:'restaurante',name:'Restaurante de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Lugar para el equipo.'},
{id:4,type:'contacto',name:'Productor local',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Contacto principal de la plaza.'}
];
let data=loadData();let current='inicio';
function loadData(){try{const raw=localStorage.getItem('registroPirulo');return raw?JSON.parse(raw):seed}catch(e){return seed}}
const labels={hotel:'🏨 Hoteles',teatro:'🎭 Teatros',restaurante:'🍽️ Restaurantes',contacto:'👤 Contactos',ciudad:'📍 Ciudades'};
function save(){try{localStorage.setItem('registroPirulo',JSON.stringify(data));return true}catch(e){return false}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){let items=[['inicio','Inicio'],['hotel','🏨 Hoteles'],['teatro','🎭 Teatros'],['restaurante','🍽️ Restaurantes'],['contacto','👤 Contactos'],['ciudad','📍 Ciudades']];document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${current===k?'active':''}" onclick="current='${k}';render()">${v}</button>`).join('')}
function card(x){let meta=[x.city,x.address].filter(Boolean).join(' · ');return `<article class="card"><span class="tag">${labels[x.type]}${x.favorite?' · ⭐':''}</span><h4>${esc(x.name)}</h4>${meta?`<div class="meta">📍 ${esc(meta)}</div>`:''}${x.contact?`<div class="meta">👤 ${esc(x.contact)}</div>`:''}${x.phone?`<div class="meta">📞 ${esc(x.phone)}</div>`:''}${x.rating?`<div class="meta">${x.rating}</div>`:''}${x.notes?`<div class="notes">${esc(x.notes)}</div>`:''}<div class="actions">${x.phone?`<button onclick="location.href='tel:${esc(x.phone)}'">Llamar</button><button onclick="window.open('https://wa.me/${x.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}${x.address?`<button onclick="window.open('https://maps.apple.com/?q=${encodeURIComponent(x.address+' '+x.city)}','_blank')">Mapa</button>`:''}<button class="danger" onclick="removeItem(${x.id})">Eliminar</button></div></article>`}
function cityCard(x){let n=data.filter(y=>y.city===x.city).length;return `<article class="card city"><div class="cityicon">📍</div><div><h4>${esc(x.city)}</h4><small>${n} registro${n===1?'':'s'} asociados</small></div></article>`}
function render(){nav();let q=(document.getElementById('search').value||'').toLowerCase().trim();let filtered=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));let c=document.getElementById('content');if(current==='inicio'){let cities=[...new Set(data.map(x=>x.city).filter(Boolean))];c.innerHTML=`<section class="hero"><div class="eyebrow">REGISTRO PIRULO</div><h2>La información de cada plaza, siempre a mano.</h2><p>Guardá hoteles, teatros, restaurantes, contactos y ciudades para que cada gira empiece con todo organizado.</p><span class="mini">💾 Los datos se guardan en este dispositivo</span></section><div class="grid"><div class="stat"><b>${data.length}</b><span>Registros</span></div><div class="stat"><b>${data.filter(x=>x.type==='hotel').length}</b><span>Hoteles</span></div><div class="stat"><b>${data.filter(x=>x.type==='teatro').length}</b><span>Teatros</span></div><div class="stat"><b>${cities.length}</b><span>Ciudades</span></div></div><div class="section-head"><h3>Últimos registros</h3><button class="link" onclick="current='inicio';document.getElementById('search').focus()">Buscar</button></div><div class="cards">${filtered.slice(-6).reverse().map(card).join('')||'<div class="empty">No encontramos registros.</div>'}</div>`}else if(current==='ciudad'){let cities=[...new Map(filtered.filter(x=>x.city).map(x=>[x.city,x])).values()];c.innerHTML=`<div class="section-head"><h3>Ciudades</h3><button class="primary" onclick="openModal('ciudad')">＋ Agregar</button></div><div class="cards">${cities.map(cityCard).join('')||'<div class="empty">Todavía no hay ciudades cargadas.</div>'}</div>`}else{c.innerHTML=`<div class="section-head"><h3>${labels[current]}</h3><button class="primary" onclick="openModal('${current}')">＋ Agregar</button></div><div class="cards">${filtered.filter(x=>x.type===current).map(card).join('')||'<div class="empty">No hay registros en esta sección.<br><br>Tocá “＋ Agregar” para cargar el primero.</div>'}</div>`}}
function openModal(type){document.getElementById('modal').classList.add('open');if(type&&type!=='inicio')document.getElementById('type').value=type}function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset()}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function addRecord(){const name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').focus();toast('Completá el nombre');return false}const record={id:Date.now(),type:document.getElementById('type').value,name,city:document.getElementById('city').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),contact:document.getElementById('contact').value.trim(),rating:document.getElementById('rating').value,favorite:document.getElementById('favorite').value==='si',notes:document.getElementById('notes').value.trim()};data.push(record);const stored=save();closeModal();render();toast(stored?'Registro guardado ✓':'Registro agregado (guardado temporalmente)');return false}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();addRecord()});document.querySelector('.save').addEventListener('click',e=>{e.preventDefault();addRecord()});function removeItem(id){if(confirm('¿Eliminar este registro?')){data=data.filter(x=>x.id!==id);save();render();toast('Registro eliminado')}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
