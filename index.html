<style>

-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 11px}.section-head h3{font-size:18px;margin:0}.link{border:0;background:transparent;color:var(--muted);font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.tag{display:inline-flex;background:var(--soft);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:10px}.card h4{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin:5px 0}.notes{color:#454850;font-size:13px;line-height:1.4;margin-top:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:750}.actions .danger{color:#b42318}.empty{grid-column:1/-1;padding:42px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.city{display:flex;align-items:center;gap:12px}.cityicon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}.city h4{margin:0 0 3px}.city small{color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:93vh;overflow:auto;border-radius:25px 25px 0 0;padding:21px;padding-bottom:calc(21px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#5d6169}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}.field textarea{min-height:92px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{border:0;border-radius:11px;padding:11px 15px;font-weight:750}.cancel{background:var(--soft)}.save{background:var(--accent);color:#fff}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#17181c;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{padding:20px 16px 13px}.brand h1{font-size:27px}.top .add{padding:10px 12px}.search,.nav,.content{padding-left:16px;padding-right:16px}.grid,.cards,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:19px}.hero h2{font-size:22px}}

.auth-screen.show{display:flex}.auth-box{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 25px 70px #0005}
.auth-logo{font-size:12px;font-weight:800;letter-spacing:.12em;color:#777;text-transform:uppercase}.auth-box h1{margin:6px 0 5px;font-size:30px}.auth-box p{margin:0 0 22px;color:#777}.auth-field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.auth-field label{font-size:12px;font-weight:800;color:#555}.auth-field input{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;outline:none}.auth-submit{width:100%;border:0;background:#111318;color:#fff;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}.auth-error{display:none;background:#fff0f0;color:#b42318;border:1px solid #f0c5c5;border-radius:10px;padding:10px;font-size:13px;margin:12px 0}.userbar{display:flex;align-items:center;gap:8px}.logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:750;font-size:12px}

.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.history-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.history-item h4{margin:0 0 6px}.history-year{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}.admin-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.admin-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:auto}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.admin-table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.role{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);font-weight:800;font-size:11px}.role.admin{background:#111318;color:#fff}.status-on{color:var(--green);font-weight:800}.admin-note{color:var(--muted);font-size:12px;margin:0 0 14px}.admin-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.admin-title h3{margin:0}.admin-refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:750;font-size:12px}
@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.admin-table{min-width:520px}}

<div class="auth-screen" id="authScreen">

    <div class="auth-error" id="authError"></div>
    <form id="loginForm">
      <div class="auth-field"><label>Correo electrónico</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="tu@email.com"></div>
      <div class="auth-field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></div>

<div class="app">
<header class="top"><div class="brand"><div class="eyebrow">VALMA GROUP · PRODUCCIONES</div><h1>Registro Pirulo</h1><p>Todo lo de la gira, en un solo lugar.</p></div><div class="userbar"><button class="logout" id="adminBtn" style="display:none" onclick="current='admin';render()">⚙️ Administración</button><button class="logout" onclick="logout()">Cerrar sesión</button><button class="add" onclick="openModal()">＋ Agregar</button></div></header>
<div class="search"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Buscar hotel, teatro, ciudad, contacto..." oninput="render()"></div></div>
<nav class="nav" id="nav"></nav><main class="content" id="content"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle">Nuevo registro</h2><form id="form"><div class="formgrid">
<div class="field"><label>Tipo</label><select id="type"><option value="hotel">🏨 Hotel</option><option value="teatro">🎭 Teatro / sala</option><option value="restaurante">🍽️ Restaurante</option><option value="contacto">👤 Contacto</option><option value="ciudad">📍 Ciudad</option></select></div>
<div class="field"><label>Nombre</label><input id="name" required placeholder="Nombre"></div><div class="field"><label>Ciudad</label><input id="city" placeholder="Ciudad"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="phone" placeholder="+54 9..."></div><div class="field"><label>Dirección</label><input id="address" placeholder="Dirección"></div><div class="field"><label>Contacto / cargo</label><input id="contact" placeholder="Ej. Juan — Producción"></div><div class="field"><label>Calificación</label><select id="rating"><option value="">Sin calificar</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div><div class="field"><label>Favorito</label><select id="favorite"><option value="no">No</option><option value="si">Sí</option></select></div><div class="field full"><label>Notas</label><textarea id="notes" placeholder="Precios, condiciones, experiencia, horarios, datos importantes..."></textarea></div>
</div><div class="modal-actions"><button type="button" class="cancel" onclick="closeModal()">Cancelar</button><button type="button" class="save">Guardar registro</button></div></form></div></div>
<div class="modal" id="historyModal" onclick="if(event.target===this)closeHistoryModal()"><div class="sheet"><h2 id="historyModalTitle">Nueva visita / gira</h2><form id="historyForm"><div class="formgrid">
<div class="field"><label>Fecha</label><input id="hdate" type="date" required></div>
<div class="field"><label>Ciudad</label><input id="hcity" placeholder="Ej. Villa María" required></div>
<div class="field full"><label>Lugar</label><select id="hplace"><option value="">Sin lugar asociado</option></select></div>
<div class="field"><label>Actividad</label><input id="hactivity" placeholder="Función, visita, hotel, reunión..." ></div>
<div class="field full"><label>Notas</label><textarea id="hnotes" placeholder="Qué hicieron, con quién, observaciones, etc."></textarea></div>
</div><div class="modal-actions"><button type="button" class="cancel" onclick="closeHistoryModal()">Cancelar</button><button type="button" class="save" id="historySave">Guardar visita</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zokglvgjjbbmeqyfjcro.supabase.co"; const SUPABASE_KEY="sb_publishable_WJ95387z4Kh4in6X94QsQg_shJ1TWfV"; const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
const seed=[
{id:1,type:'hotel',name:'Hotel de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Reemplazar con datos reales.'},
{id:2,type:'teatro',name:'Teatro de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Ficha preparada para completar.'},
{id:3,type:'restaurante',name:'Restaurante de ejemplo',city:'Río Cuarto',phone:'',address:'',contact:'',rating:'',favorite:false,notes:'Lugar para el equipo.'},
{id:4,type:'contacto',name:'Productor local',city:'Río Cuarto',phone:'',address:'',contact:'Producción',rating:'',favorite:false,notes:'Contacto principal de la plaza.'}
];
let data=[];let historyData=[];let current='inicio';let currentProfile=null;let isAdmin=false;let editingHistoryId=null;let historyFilterCity='';let historyFilterPlaceId='';
async function loadProfile(){
  if(!currentUser){currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';return;}
  const {data:p,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  currentProfile=p||null;
  isAdmin=!!p&&p.role==='admin'&&p.active!==false;
  const btn=document.getElementById('adminBtn'); if(btn) btn.style.display=isAdmin?'inline-block':'none';
}
async function logActivity(action,entityType='',entityId=null,detail=''){
  if(!currentUser)return;
  const {error}=await supabaseClient.from('activity_log').insert({user_id:currentUser.id,action,entity_type:entityType,entity_id:entityId,detail});
  if(error) console.warn('No se pudo registrar actividad',error);
}
async function markLogin(){
  if(!currentUser)return;
  await supabaseClient.from('profiles').update({last_login_at:new Date().toISOString()}).eq('id',currentUser.id);
  await logActivity('Inicio de sesión');
}
async function loadData(){
  if(!currentUser){data=[];return;}
  let {data:rows,error}=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
  if(error){console.error(error);toast('No se pudieron cargar los registros');data=[];return;}
  rows=rows||[];
  // Migra automáticamente los registros locales de la versión anterior, si existen y la nube está vacía.
  if(rows.length===0){
    try{
      const raw=localStorage.getItem('registroPirulo');
      const local=raw?JSON.parse(raw):[];
      if(Array.isArray(local)&&local.length){
        const payload=local.map(x=>({user_id:currentUser.id,type:x.type,name:x.name,city:x.city||'',phone:x.phone||'',address:x.address||'',contact:x.contact||'',rating:x.rating||'',favorite:!!x.favorite,notes:x.notes||''}));
        const {error:me}=await supabaseClient.from('registros').insert(payload);
        if(!me){
          const again=await supabaseClient.from('registros').select('*').order('created_at',{ascending:true});
          rows=again.data||[];
          localStorage.removeItem('registroPirulo');
          toast('Registros anteriores migrados ✓');
        }
      }
    }catch(e){console.warn('No se pudo migrar el almacenamiento local',e)}
  }
  data=rows;
  const hr=await supabaseClient.from('historial_giras').select('*').order('visit_date',{ascending:false});
  if(hr.error){console.error(hr.error);historyData=[]}else historyData=hr.data||[];
}

const labels={hotel:'🏨 Hoteles',teatro:'🎭 Teatros',restaurante:'🍽️ Restaurantes',contacto:'👤 Contactos',ciudad:'📍 Ciudades'};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){let items=[['inicio','Inicio'],['hotel','🏨 Hoteles'],['teatro','🎭 Teatros'],['restaurante','🍽️ Restaurantes'],['contacto','👤 Contactos'],['ciudad','📍 Ciudades'],['historial','📅 Historial']];if(isAdmin)items.push(['admin','⚙️ Administración']);document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${current===k?'active':''}" onclick="current='${k}';if('${k}'!=='historial'){historyFilterCity='';historyFilterPlaceId=''}render()">${v}</button>`).join('')}
function card(x){let meta=[x.city,x.address].filter(Boolean).join(' · ');return `<article class="card"><span class="tag">${labels[x.type]}${x.favorite?' · ⭐':''}</span><h4>${esc(x.name)}</h4>${meta?`<div class="meta">📍 ${esc(meta)}</div>`:''}${x.contact?`<div class="meta">👤 ${esc(x.contact)}</div>`:''}${x.phone?`<div class="meta">📞 ${esc(x.phone)}</div>`:''}${x.rating?`<div class="meta">${x.rating}</div>`:''}${x.notes?`<div class="notes">${esc(x.notes)}</div>`:''}<div class="actions">${x.phone?`<button onclick="location.href='tel:${esc(x.phone)}'">Llamar</button><button onclick="window.open('https://wa.me/${x.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}${x.address?`<button onclick="window.open('https://maps.apple.com/?q=${encodeURIComponent(x.address+' '+x.city)}','_blank')">Mapa</button>`:''}<button onclick="historyFilterPlaceId='${x.id}';historyFilterCity='${esc(x.city||'').replace(/'/g,'\\\'')}';current='historial';render()">Historial</button><button onclick="editItem(${x.id})">Editar</button><button class="danger" onclick="removeItem(${x.id})">Eliminar</button></div></article>`}
function cityCard(x){let n=data.filter(y=>y.city===x.city).length;return `<article class="card city" onclick="historyFilterCity='${esc(x.city).replace(/'/g,'\\\'')}';historyFilterPlaceId='';current='historial';render()" style="cursor:pointer"><div class="cityicon">📍</div><div><h4>${esc(x.city)}</h4><small>${n} registro${n===1?'':'s'} asociados · ver historial →</small></div></article>`}
async function renderAdmin(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="section-head"><h3>Administración</h3><button class="admin-refresh" onclick="renderAdmin()">↻ Actualizar</button></div><p class="admin-note">Solo los administradores pueden ver usuarios y actividad. Los nuevos usuarios se crean desde Supabase Authentication.</p><div class="admin-grid"><section class="admin-card"><div class="admin-title"><h3>👥 Usuarios</h3></div><div id="adminUsers">Cargando...</div></section><section class="admin-card"><div class="admin-title"><h3>🔐 Actividad reciente</h3></div><div id="adminActivity">Cargando...</div></section></div>`;
  const [pr,ar]=await Promise.all([
    supabaseClient.from('profiles').select('id,email,role,active,created_at,last_login_at').order('created_at',{ascending:true}),
    supabaseClient.from('activity_log').select('id,user_id,action,entity_type,entity_id,detail,created_at,profiles(email)').order('created_at',{ascending:false}).limit(100)
  ]);
  if(pr.error){document.getElementById('adminUsers').innerHTML=`<div class="empty">No se pudieron cargar los usuarios.</div>`}
  else{
    const users=pr.data||[];
    document.getElementById('adminUsers').innerHTML=users.length?`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Correo</th><th>Rol</th><th>Estado</th><th>Último acceso</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.email||'')}</td><td><span class="role ${u.role==='admin'?'admin':''}">${u.role==='admin'?'Administrador':u.role==='produccion'?'Producción':'Consulta'}</span></td><td class="${u.active?'status-on':''}">${u.active?'● Activo':'● Bloqueado'}</td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString('es-AR'):'Nunca'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay usuarios.</div>';
  }
  if(ar.error){document.getElementById('adminActivity').innerHTML=`<div class="empty">No se pudo cargar la actividad.</div>`}
  else{
    const logs=ar.data||[];
    document.getElementById('adminActivity').innerHTML=logs.length?`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${logs.map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('es-AR')}</td><td>${esc(a.profiles?.email||'')}</td><td>${esc(a.action||'')}</td><td>${esc(a.detail||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay actividad.</div>';
  }
}
async function openHistoryModal(prefCity='',prefPlaceId=''){
  editingHistoryId=null; document.getElementById('historyModalTitle').textContent='Nueva visita / gira'; document.getElementById('historyForm').reset();
  document.getElementById('hdate').value=new Date().toISOString().slice(0,10); document.getElementById('hcity').value=prefCity||historyFilterCity||'';
  await populateHistoryPlaces(prefPlaceId||historyFilterPlaceId); document.getElementById('historyModal').classList.add('open');
}
async function populateHistoryPlaces(selected=''){
  const city=document.getElementById('hcity').value.trim().toLowerCase(); const sel=document.getElementById('hplace');
  const places=data.filter(x=>['hotel','teatro','restaurante'].includes(x.type)&&(!city||String(x.city||'').toLowerCase()===city));
  sel.innerHTML='<option value="">Sin lugar asociado</option>'+places.map(x=>`<option value="${x.id}">${esc(x.name)}${x.city?' · '+esc(x.city):''}</option>`).join(''); if(selected)sel.value=selected;
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='hcity')populateHistoryPlaces();});
function closeHistoryModal(){document.getElementById('historyModal').classList.remove('open');editingHistoryId=null}
function renderHistory(filtered){
  let rows=historyData.slice(); if(historyFilterCity)rows=rows.filter(h=>String(h.city||'').toLowerCase()===historyFilterCity.toLowerCase()); if(historyFilterPlaceId)rows=rows.filter(h=>String(h.place_id||'')===String(historyFilterPlaceId));
  const q=(document.getElementById('search').value||'').toLowerCase().trim(); if(q)rows=rows.filter(h=>Object.values(h).join(' ').toLowerCase().includes(q));
  const groups={}; rows.forEach(h=>{const y=(h.visit_date||'').slice(0,4)||'Sin año';(groups[y]??=[]).push(h)});
  const placeName=id=>{const p=data.find(x=>String(x.id)===String(id));return p?p.name:'Sin lugar asociado'};
  const cards=Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(y=>`<div class="history-year">${esc(y)}</div><div class="cards">${groups[y].map(h=>`<article class="history-item"><h4>📅 ${esc(h.visit_date||'')}</h4><div class="meta">📍 ${esc(h.city||'')}</div><div class="meta">🏷️ ${esc(placeName(h.place_id))}</div>${h.activity?`<div class="meta">🎬 ${esc(h.activity)}</div>`:''}${h.notes?`<div class="notes">${esc(h.notes)}</div>`:''}<div class="actions"><button onclick="editHistory(${h.id})">Editar</button><button class="danger" onclick="removeHistory(${h.id})">Eliminar</button></div></article>`).join('')}</div>`).join('');
  document.getElementById('content').innerHTML=`<div class="section-head"><div><h3>📅 Historial / Giras</h3>${historyFilterCity?`<div class="meta">Ciudad: <b>${esc(historyFilterCity)}</b> · <button class="link" onclick="historyFilterCity='';historyFilterPlaceId='';render()">Ver todo</button></div>`:''}</div><button class="primary" onclick="openHistoryModal()">＋ Registrar visita</button></div>${cards||'<div class="empty">Todavía no hay visitas registradas.<br><br>Agregá la primera fecha de una gira.</div>'}`;
}
function editHistory(id){const h=historyData.find(x=>Number(x.id)===Number(id));if(!h)return;editingHistoryId=h.id;document.getElementById('historyModalTitle').textContent='Editar visita / gira';document.getElementById('hdate').value=h.visit_date||'';document.getElementById('hcity').value=h.city||'';document.getElementById('hactivity').value=h.activity||'';document.getElementById('hnotes').value=h.notes||'';populateHistoryPlaces(h.place_id).then(()=>document.getElementById('historyModal').classList.add('open'))}
async function saveHistory(){const btn=document.getElementById('historySave');if(btn.disabled)return;const city=document.getElementById('hcity').value.trim();if(!city||!document.getElementById('hdate').value){toast('Completá fecha y ciudad');return}btn.disabled=true;const payload={visit_date:document.getElementById('hdate').value,city,place_id:document.getElementById('hplace').value?Number(document.getElementById('hplace').value):null,activity:document.getElementById('hactivity').value.trim(),notes:document.getElementById('hnotes').value.trim()};const result=editingHistoryId?await supabaseClient.from('historial_giras').update(payload).eq('id',editingHistoryId):await supabaseClient.from('historial_giras').insert({...payload,user_id:currentUser.id});if(result.error){toast('No se pudo guardar: '+result.error.message);btn.disabled=false;return}await logActivity(editingHistoryId?'Visita modificada':'Visita registrada','historial_giras',editingHistoryId||null,city);await loadData();closeHistoryModal();render();toast(editingHistoryId?'Cambios guardados ✓':'Visita registrada ✓');btn.disabled=false}
async function removeHistory(id){if(!confirm('¿Eliminar esta visita del historial?'))return;const {error}=await supabaseClient.from('historial_giras').delete().eq('id',id);if(error){toast('No se pudo eliminar');return}await logActivity('Visita eliminada','historial_giras',id);await loadData();render();toast('Visita eliminada')}
document.getElementById('historySave').addEventListener('click',saveHistory);
function render(){nav();let q=(document.getElementById('search').value||'').toLowerCase().trim();let filtered=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));let c=document.getElementById('content');if(current==='admin'&&isAdmin){renderAdmin();return}if(current==='inicio'){let cities=[...new Set(data.map(x=>x.city).filter(Boolean))];c.innerHTML=`<section class="hero"><div class="eyebrow">REGISTRO PIRULO</div><h2>La información de cada plaza, siempre a mano.</h2><p>Guardá hoteles, teatros, restaurantes, contactos y ciudades para que cada gira empiece con todo organizado.</p><span class="mini">☁️ Los datos se guardan de forma segura y compartida</span></section><div class="grid"><div class="stat"><b>${data.length}</b><span>Registros</span></div><div class="stat"><b>${data.filter(x=>x.type==='hotel').length}</b><span>Hoteles</span></div><div class="stat"><b>${data.filter(x=>x.type==='teatro').length}</b><span>Teatros</span></div><div class="stat"><b>${cities.length}</b><span>Ciudades</span></div></div><div class="section-head"><h3>Últimos registros</h3><button class="link" onclick="current='inicio';document.getElementById('search').focus()">Buscar</button></div><div class="cards">${filtered.slice(-6).reverse().map(card).join('')||'<div class="empty">No encontramos registros.</div>'}</div>`}else if(current==='historial'){renderHistory(filtered)}else if(current==='ciudad'){let cities=[...new Map(filtered.filter(x=>x.city).map(x=>[x.city,x])).values()];c.innerHTML=`<div class="section-head"><h3>Ciudades</h3><button class="primary" onclick="openModal('ciudad')">＋ Agregar</button></div><div class="cards">${cities.map(cityCard).join('')||'<div class="empty">Todavía no hay ciudades cargadas.</div>'}</div>`}else{c.innerHTML=`<div class="section-head"><h3>${labels[current]}</h3><button class="primary" onclick="openModal('${current}')">＋ Agregar</button></div><div class="cards">${filtered.filter(x=>x.type===current).map(card).join('')||'<div class="empty">No hay registros en esta sección.<br><br>Tocá “＋ Agregar” para cargar el primero.</div>'}</div>`}}
let editingId=null;
function openModal(type){
  editingId=null;
  document.getElementById('modalTitle').textContent='Nuevo registro';
  document.querySelector('.save').textContent='Guardar registro';
  document.getElementById('modal').classList.add('open');
  document.getElementById('form').reset();
  if(type&&type!=='inicio')document.getElementById('type').value=type;
}
function editItem(id){
  const x=data.find(r=>Number(r.id)===Number(id));
  if(!x)return;
  editingId=x.id;
  document.getElementById('modalTitle').textContent='Editar registro';
  document.querySelector('.save').textContent='Guardar cambios';
  document.getElementById('type').value=x.type||'hotel';
  document.getElementById('name').value=x.name||'';
  document.getElementById('city').value=x.city||'';
  document.getElementById('phone').value=x.phone||'';
  document.getElementById('address').value=x.address||'';
  document.getElementById('contact').value=x.contact||'';
  document.getElementById('rating').value=x.rating||'';
  document.getElementById('favorite').value=x.favorite?'si':'no';
  document.getElementById('notes').value=x.notes||'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('form').reset();
  editingId=null;
  document.getElementById('modalTitle').textContent='Nuevo registro';
  document.querySelector('.save').textContent='Guardar registro';
}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function addRecord(){
  const btn=document.querySelector('.save');
  if(btn.disabled) return false;
  const name=document.getElementById('name').value.trim();
  if(!name){document.getElementById('name').focus();toast('Completá el nombre');return false}
  btn.disabled=true;
  const payload={
    type:document.getElementById('type').value,
    name,
    city:document.getElementById('city').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    address:document.getElementById('address').value.trim(),
    contact:document.getElementById('contact').value.trim(),
    rating:document.getElementById('rating').value,
    favorite:document.getElementById('favorite').value==='si',
    notes:document.getElementById('notes').value.trim()
  };
  let result;
  if(editingId){
    result=await supabaseClient.from('registros').update(payload).eq('id',editingId);
  }else{
    result=await supabaseClient.from('registros').insert({...payload,user_id:currentUser.id});
  }
  const {error}=result;
  if(error){console.error(error);btn.disabled=false;toast((editingId?'No se pudieron guardar los cambios: ':'No se pudo guardar: ')+(error.message||'error'));return false}
  await logActivity(editingId?'Registro modificado':'Registro creado', 'registro', editingId||null, payload.name||'');
await loadData();closeModal();render();toast(editingId?'Cambios guardados ✓':'Registro guardado ✓');setTimeout(()=>{btn.disabled=false},250);return false
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();addRecord()});document.querySelector('.save').addEventListener('click',e=>{e.preventDefault();addRecord()});async function removeItem(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const {error}=await supabaseClient.from('registros').delete().eq('id',id);
  if(error){console.error(error);toast('No se pudo eliminar');return}
  await logActivity('Registro eliminado','registro',id);
  await loadData();render();toast('Registro eliminado')
}
async function logout(){await logActivity('Cierre de sesión');await supabaseClient.auth.signOut()}
function showAuth(message=''){
  document.getElementById('authScreen').classList.add('show');
  document.getElementById('authError').style.display=message?'block':'none';
  document.getElementById('authError').textContent=message;
  document.querySelector('.app').style.display='none';
}
function hideAuth(){
  document.getElementById('authScreen').classList.remove('show');
  document.querySelector('.app').style.display='block';
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Ingresando...';
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) showAuth('Correo o contraseña incorrectos.');
  btn.disabled=false;btn.textContent='Iniciar sesión';
});
supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    hideAuth();
    await loadProfile();
    if(_event==='SIGNED_IN') await markLogin();
    await loadData();render();
  }else{data=[];currentProfile=null;isAdmin=false;document.getElementById('adminBtn').style.display='none';showAuth();}
});
showAuth();

</script></body></html>
